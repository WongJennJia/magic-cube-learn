<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魔术方块小达人</title>
<meta name="description" content="给小学生的魔术方块教学：7 步学会还原，观察力训练游戏，计时器，冲向 20 秒。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: sticky top bar; reading column + sticky 3D cube player on wide screens; one column on phones.
   Look: the cube itself — black body, rounded stickers, six sticker colors used only where they mean a color. */
:root {
  --bg: #F1F4F9;
  --surface: #FFFFFF;
  --surface-2: #E9EEF6;
  --ink: #172031;
  --ink-soft: #55617A;
  --line: #D6DDE9;
  --accent: #1B57D6;
  --accent-deep: #123E9E;
  --on-accent: #FFFFFF;
  --accent-soft: #E1EAFE;
  --note-soft: #FFF3C9;
  --note-line: #F0D46A;
  --good: #0F7A45;
  --good-soft: #DBF4E6;
  --warn: #A64B00;
  --warn-soft: #FFE9D6;
  --stage: radial-gradient(circle at 50% 42%, #FFFFFF 0%, #E8EDF6 70%);
  --cube-body: #16181D;
  --W: #FFFFFF; --Y: #FFD21F; --G: #14A44D; --B: #1F5FE0; --R: #E2302F; --O: #FF8A1C; --X: #A9B0BB;
  --font-display: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-move: "Fredoka", "Noto Sans SC", system-ui, sans-serif;
  --r-card: 18px;
  --r-btn: 12px;
  --shadow: 0 1px 0 rgba(23, 32, 49, .05), 0 8px 24px rgba(23, 32, 49, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E121A; --surface: #171D28; --surface-2: #222A38; --ink: #ECF1F8; --ink-soft: #A3AEC3; --line: #2E3849;
    --accent: #6E9BFF; --accent-deep: #3F6AD0; --on-accent: #0B1220; --accent-soft: #1B2949; --note-soft: #33290B; --note-line: #7A6418;
    --good: #52CC8E; --good-soft: #143222; --warn: #FFA764; --warn-soft: #3A2614;
    --stage: radial-gradient(circle at 50% 42%, #2A3446 0%, #171D28 72%);
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E121A; --surface: #171D28; --surface-2: #222A38; --ink: #ECF1F8; --ink-soft: #A3AEC3; --line: #2E3849;
  --accent: #6E9BFF; --accent-deep: #3F6AD0; --on-accent: #0B1220; --accent-soft: #1B2949; --note-soft: #33290B; --note-line: #7A6418;
  --good: #52CC8E; --good-soft: #143222; --warn: #FFA764; --warn-soft: #3A2614;
  --stage: radial-gradient(circle at 50% 42%, #2A3446 0%, #171D28 72%);
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.3; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); letter-spacing: .01em; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(23px, 3.2vw, 30px); }
h3 { font-size: 19px; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--ink-soft); }
.small { font-size: 14px; }
.eyebrow { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand b { font-family: var(--font-display); font-weight: 400; font-size: 22px; white-space: nowrap; }
.logo { display: grid; grid-template-columns: repeat(3, 9px); gap: 2px; padding: 3px; background: var(--cube-body); border-radius: 6px; }
.logo i { width: 9px; height: 9px; border-radius: 2px; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; text-decoration: none; color: var(--ink-soft); font-weight: 700; font-size: 15px; padding: 7px 12px; border-radius: 10px; white-space: nowrap; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
@media (max-width: 760px) {
  .topbar-in { flex-wrap: wrap; gap: 6px 12px; padding-block: 8px 6px; }
  .nav { flex-basis: 100%; margin-inline: -6px; }
}

/* ---------- page frame ---------- */
#main { max-width: 1180px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
.page-head { display: grid; gap: 10px; max-width: 760px; }
.lead { font-size: 18px; color: var(--ink-soft); max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.crumbs { display: flex; gap: 8px; font-size: 14px; color: var(--ink-soft); }
.crumbs a { color: var(--ink-soft); }
.sec-head { display: grid; gap: 6px; margin-bottom: 18px; }
.sec-head p { color: var(--ink-soft); }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; padding: 11px 18px; border-radius: var(--r-btn); box-shadow: 0 3px 0 var(--accent-deep); transition: transform .08s, box-shadow .08s; line-height: 1.2; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); padding: 9px 16px; }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn.small { font-size: 14px; padding: 8px 13px; }
.btn.ghost.small { padding: 6px 11px; }
.icon-btn { width: 42px; height: 42px; display: inline-grid; place-items: center; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer; color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.small { width: 30px; height: 30px; border-radius: 8px; font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); }

/* ---------- move chips ---------- */
.mv { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 46px; padding: 4px 7px 3px; border: 2px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink); line-height: 1.1; cursor: pointer; }
.mv b { font-family: var(--font-move); font-weight: 600; font-size: 19px; }
.mv small { font-size: 11px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; }
.mv.static { cursor: default; }
.mv.done { opacity: .42; }
.mv.now { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.alg-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.alg-chips.big .mv { min-width: 54px; padding: 6px 9px 5px; }
.alg-chips.big .mv b { font-size: 23px; }
.dot { display: inline-block; width: 16px; height: 16px; border-radius: 5px; border: 2px solid var(--cube-body); vertical-align: -3px; }
.pair-dots { display: inline-flex; gap: 4px; }
.pair-dots.big .dot { width: 28px; height: 28px; border-radius: 8px; }

/* ---------- 3D cube ---------- */
.cv { position: relative; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.cv:active { cursor: grabbing; }
.cv-scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.cv-cube { position: relative; width: 1em; height: 1em; transform-style: preserve-3d; }
.cubie { position: absolute; left: 0; top: 0; width: 1em; height: 1em; transform-style: preserve-3d; }
.cf { position: absolute; left: 0; top: 0; width: 1em; height: 1em; background: #121418; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: .07em; }
.st { position: absolute; inset: .065em; border-radius: .15em; background: var(--X); background-image: linear-gradient(150deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 55%); transition: opacity .2s; }
.st[data-c="W"] { background-color: var(--W); } .st[data-c="Y"] { background-color: var(--Y); } .st[data-c="G"] { background-color: var(--G); }
.st[data-c="B"] { background-color: var(--B); } .st[data-c="R"] { background-color: var(--R); } .st[data-c="O"] { background-color: var(--O); }
.st[data-c="X"] { background-color: var(--X); }
.st.dim { opacity: .14; }

/* ---------- diagrams ---------- */
.iso, .top, .net, .grid3 { display: block; width: 100%; height: auto; }
.svg-cap { fill: var(--ink-soft); font-family: var(--font-body); }
.iso-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
figure { margin: 0; }
.dg { display: grid; gap: 8px; justify-items: center; }
.dg .dg-pic { width: 100%; max-width: 230px; }
.dg.wide .dg-pic { max-width: 280px; }
.dg.small .dg-pic { max-width: 150px; }
.dg figcaption { font-size: 14px; color: var(--ink-soft); text-align: center; max-width: 40ch; }
.swatch-big { width: 120px; height: 120px; border-radius: 22px; border: 6px solid var(--cube-body); margin: 10px auto; }

/* ---------- player ---------- */
.pl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; }
.pl-head { display: grid; gap: 2px; min-height: 22px; }
.pl-title { font-weight: 700; font-size: 17px; }
.pl-sub { font-size: 14px; color: var(--ink-soft); }
.pl-stage { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1; margin: 0 auto; background: var(--stage); border-radius: 16px; }
.pl-cube { position: absolute; inset: 4%; }
.pl-viewbtn { position: absolute; top: 8px; right: 8px; }
.pl-drag { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--ink-soft); pointer-events: none; }
.pl-drag svg { width: 16px; height: 16px; }
.pl-next { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 10px; }
.nx-pic { width: 92px; }
.nx-text { display: grid; gap: 2px; min-width: 0; }
.nx-k { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.nx-move { display: flex; align-items: baseline; gap: 10px; }
.nx-move b { font-family: var(--font-move); font-size: 34px; font-weight: 600; line-height: 1; }
.nx-move span { font-weight: 700; font-size: 18px; }
.nx-text p { font-size: 14px; }
.nx-seg { font-size: 12px; color: var(--accent); font-weight: 700; }
.nx-done { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; color: var(--good); }
.nx-done svg { width: 34px; height: 34px; flex: none; }
.nx-done b { display: block; font-size: 17px; }
.nx-done span { color: var(--ink-soft); font-size: 14px; }
.nx-done span svg { width: 14px; height: 14px; vertical-align: -2px; }
.pl-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.pl-play { min-width: 112px; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 11px; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink-soft); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.pl-chips { max-height: 230px; overflow: auto; display: grid; gap: 8px; padding-right: 4px; }
.pl-stagehead { font-weight: 700; font-size: 14px; color: var(--ink); padding-top: 6px; border-top: 1px solid var(--line); }
.pl-stagehead:first-child { border-top: 0; padding-top: 0; }
.pl-seg { display: grid; gap: 4px; }
.pl-segname { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.pl-segchips { display: flex; flex-wrap: wrap; gap: 5px; }
.pl-segchips .mv { min-width: 42px; }
.pl-segchips .mv b { font-size: 16px; }

/* ---------- lesson layout ---------- */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); grid-template-areas: "head head" "main side"; gap: 28px 40px; align-items: start; }
.lesson-head { grid-area: head; display: grid; gap: 8px; max-width: 780px; }
.lesson-main { grid-area: main; min-width: 0; display: grid; gap: 22px; }
.lesson-side { grid-area: side; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); min-width: 0; }
.goal { font-size: 18px; color: var(--ink-soft); }
.goal b { color: var(--ink); }
.dock { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 112px); }
.dock.inline { margin-block: 4px; }
@media (max-width: 900px) {
  .lesson { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "side" "main"; }
  .lesson-side { position: static; }
  .pl-stage { max-width: 300px; }
}
.prose > h2 { margin-top: 14px; }
.prose > h3 { margin-top: 4px; }
.prose p { max-width: 66ch; }
.prose.narrow { max-width: 760px; display: grid; gap: 16px; }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; }
.steps li::before { content: counter(s); font-family: var(--font-move); font-weight: 600; font-size: 17px; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--cube-body); color: var(--Y); margin-top: 1px; }
.checks { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.tip { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; align-items: start; }
.tip-ic { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: var(--surface); color: var(--accent); }
.tip-ic svg { width: 22px; height: 22px; }
.tip b { display: block; font-size: 16px; }
.tip.rule { background: var(--note-soft); }
.tip.rule .tip-ic { color: var(--warn); }
.pairs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pair { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 4px; }
.pair b { font-size: 18px; }
.pair p { font-size: 14px; color: var(--ink-soft); }
.pair .dot { width: 26px; height: 26px; border-radius: 8px; }
@media (max-width: 640px) { .pairs { grid-template-columns: minmax(0, 1fr); } }
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.case .dg-pic { max-width: 170px; }
.case-body { display: grid; gap: 6px; justify-items: start; }
.case-body h4 { font-size: 17px; }
.case-body p { font-size: 15px; color: var(--ink-soft); }
.algcard { background: var(--surface); border: 2px solid var(--cube-body); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.algcard-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.algcard-name { font-family: var(--font-display); font-size: 22px; }
.algcard p { font-size: 15px; color: var(--ink-soft); }
.chant { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chant span { font-size: 12px; font-weight: 700; background: var(--cube-body); color: var(--Y); padding: 3px 9px; border-radius: 99px; }
.chant b { font-size: 17px; letter-spacing: .06em; }
.practice { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 2px dashed var(--line); border-radius: 16px; padding: 14px 16px; }
.practice > div { flex: 1 1 260px; display: grid; gap: 2px; }
.practice p { font-size: 14px; color: var(--ink-soft); }
.facenames { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.facenames div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; display: grid; justify-items: center; }
.facenames b { font-family: var(--font-move); font-size: 30px; font-weight: 600; line-height: 1.1; }
.facenames small { color: var(--ink-soft); font-size: 12px; }
@media (max-width: 560px) { .facenames { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.movegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.movecard { display: grid; gap: 4px; justify-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px 8px; cursor: pointer; }
.movecard:hover { border-color: var(--accent); }
.mc-pic { width: 100%; max-width: 104px; }
.mc-txt { display: flex; gap: 8px; align-items: baseline; }
.mc-txt b { font-family: var(--font-move); font-weight: 600; font-size: 24px; }
.mc-txt small { font-weight: 700; color: var(--ink-soft); }
.mnemo { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.mnemo div { display: flex; gap: 6px; }
.shapes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .shapes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.finale { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 20px; align-items: center; background: var(--surface); border: 2px solid var(--cube-body); border-radius: 20px; padding: 20px; }
.finale > div { display: grid; gap: 10px; }
@media (max-width: 560px) { .finale { grid-template-columns: minmax(0, 1fr); } .finale-pic { max-width: 140px; } }
.lesson-end { display: grid; gap: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
.lesson-end > .btn { justify-self: start; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pn-a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.pn-a small { color: var(--ink-soft); }
.pn-a.nx { text-align: right; }

/* ---------- quiz ---------- */
.sq { display: grid; gap: 12px; }
.spotquiz, .guessgame { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.sq-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.sq-score { display: inline-flex; gap: 4px; align-items: center; color: var(--warn); }
.sq-score svg { width: 16px; height: 16px; }
.sq-body { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 18px; align-items: start; }
.sq-fig { width: 100%; }
.sq-right { display: grid; gap: 12px; min-width: 0; }
.sq-q { font-weight: 700; font-size: 18px; }
@media (max-width: 600px) { .sq-body { grid-template-columns: minmax(0, 1fr); } .sq-fig { max-width: 220px; margin: 0 auto; } }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts.four .opt { min-width: 64px; font-family: var(--font-move); font-size: 20px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt.wrong { border-style: dashed; border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }

<script>
/* ===== Cube engine: sticker model, moves, masks, beginner solver ===== */
const Cube = (() => {
  const FACES = ['U', 'R', 'F', 'D', 'L', 'B'];
  const FD = {
    U: { n: [0, 1, 0], r: [1, 0, 0], d: [0, 0, 1] },
    R: { n: [1, 0, 0], r: [0, 0, -1], d: [0, -1, 0] },
    F: { n: [0, 0, 1], r: [1, 0, 0], d: [0, -1, 0] },
    D: { n: [0, -1, 0], r: [1, 0, 0], d: [0, 0, -1] },
    L: { n: [-1, 0, 0], r: [0, 0, 1], d: [0, -1, 0] },
    B: { n: [0, 0, -1], r: [-1, 0, 0], d: [0, -1, 0] },
  };
  const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
  const key = (p, n) => p.join(',') + '|' + n.join(',');
  const SLOTS = [];
  const IDX = {};
  FACES.forEach((f, fi) => {
    const { n, r, d } = FD[f];
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const p = add(add(n, r, j - 1), d, i - 1);
      const s = { f, fi, i, j, p, n, k: SLOTS.length };
      IDX[key(p, n)] = SLOTS.length;
      SLOTS.push(s);
    }
  });
  const slotAt = (p, n) => IDX[key(p, n)];

  // rotate integer vector 90deg about axis (0=x,1=y,2=z); sign +1 = +90 (right-hand)
  function rot([x, y, z], axis, sign) {
    if (axis === 0) return sign > 0 ? [x, -z, y] : [x, z, -y];
    if (axis === 1) return sign > 0 ? [z, y, -x] : [-z, y, x];
    return sign > 0 ? [-y, x, z] : [y, -x, z];
  }
  const MD = {
    R: [0, -1, p => p[0] === 1], L: [0, 1, p => p[0] === -1], M: [0, 1, p => p[0] === 0],
    x: [0, -1, () => true], r: [0, -1, p => p[0] >= 0], l: [0, 1, p => p[0] <= 0],
    U: [1, -1, p => p[1] === 1], D: [1, 1, p => p[1] === -1], E: [1, 1, p => p[1] === 0],
    y: [1, -1, () => true], u: [1, -1, p => p[1] >= 0], d: [1, 1, p => p[1] <= 0],
    F: [2, -1, p => p[2] === 1], B: [2, 1, p => p[2] === -1], S: [2, -1, p => p[2] === 0],
    z: [2, -1, () => true], f: [2, -1, p => p[2] >= 0], b: [2, 1, p => p[2] <= 0],
  };
  const BASE = {};
  for (const m in MD) {
    const [axis, sign, layer] = MD[m];
    const perm = new Array(54);
    SLOTS.forEach((s, k) => {
      perm[k] = layer(s.p) ? slotAt(rot(s.p, axis, sign), rot(s.n, axis, sign)) : k;
    });
    BASE[m] = perm;
  }
  function compose(a, b) { // apply a then b
    const out = new Array(54);
    for (let k = 0; k < 54; k++) out[k] = b[a[k]];
    return out;
  }

const FACE_TF = { U: 'rotateX(90deg)', D: 'rotateX(-90deg)', F: 'rotateY(0deg)', B: 'rotateY(180deg)', R: 'rotateY(90deg)', L: 'rotateY(-90deg)' };
class CubeView {
  constructor(host, o = {}) {
    this.host = host;
    this.state = (o.state || Cube.solved()).slice();
    this.home = [o.rx ?? -26, o.ry ?? -36];
    [this.rx, this.ry] = this.home;
    this.dur = o.dur || 380;
    this.gen = 0;
    this.onSticker = o.onSticker || null;
    this.onUserRotate = o.onUserRotate || null;
    host.classList.add('cv');
    host.innerHTML = '<div class="cv-scene"><div class="cv-cube"></div></div>';
    this.scene = host.firstChild; this.cube = this.scene.firstChild;
    this.cubies = []; this.stickers = new Array(54);
    for (const P of Cube.POS) {
      const p = P.p;
      const el = document.createElement('div');
      el.className = 'cubie';
      const base = `translate3d(${p[0]}em,${-p[1]}em,${p[2]}em)`;
      el.style.transform = base;
      let html = '';
      for (const f of ['U', 'D', 'F', 'B', 'R', 'L']) {
        const k = Cube.slotAt(p, Cube.N[f]);
        html += `<div class="cf" style="transform:${FACE_TF[f]} translateZ(.5em)">${k !== undefined ? `<div class="st" data-slot="${k}"></div>` : ''}</div>`;
      }
      el.innerHTML = html;
      this.cube.appendChild(el);
      this.cubies.push({ el, p, base });
    }
    host.querySelectorAll('.st').forEach(s => { this.stickers[+s.dataset.slot] = s; });
    this.paint(); this.applyView();
    if (window.ResizeObserver) { this.ro = new ResizeObserver(() => this.fit()); this.ro.observe(host); }
    this.fit();
    this.bindDrag();
  }
  fit() {
    const w = this.host.clientWidth || 300;
    const s = w / 5.6;
    this.scene.style.fontSize = s + 'px';
    this.scene.style.perspective = (s * 22) + 'px';
  }
  paint() { for (let k = 0; k < 54; k++) this.stickers[k].dataset.c = this.state[k]; }
  setState(s) { this.gen++; cancelAnimationFrame(this.raf); this.cubies.forEach(c => c.el.style.transform = c.base); this.state = s.slice(); this.paint(); }
  setHighlight(set) { for (let k = 0; k < 54; k++) this.stickers[k].classList.toggle('dim', !!set && !set.has(k)); }
  applyView() { this.cube.style.transform = `rotateX(${this.rx}deg) rotateY(${this.ry}deg)`; }
  resetView() {
    const [tx, ty] = this.home, sx = this.rx, sy = this.ry;
    let ny = ((sy - ty) % 360 + 540) % 360 - 180;
    const t0 = performance.now(), D = 450;
    const st = now => {
      const t = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - t, 3);
      this.rx = sx + (tx - sx) * e; this.ry = ty + ny * (1 - e);
      this.applyView();
      if (t < 1) requestAnimationFrame(st);
    };
    requestAnimationFrame(st);
  }
  bindDrag() {
    let down = null;
    this.host.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;
      down = { x: e.clientX, y: e.clientY, rx: this.rx, ry: this.ry, moved: false, target: e.target };
      try { this.host.setPointerCapture(e.pointerId); } catch (_) { }
    });
    this.host.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!down.moved && Math.hypot(dx, dy) < 6) return;
      down.moved = true;
      this.ry = down.ry + dx * 0.55;
      this.rx = Math.max(-88, Math.min(88, down.rx - dy * 0.55));
      this.applyView();
      if (this.onUserRotate) this.onUserRotate();
    });
    const up = e => {
      if (!down) return;
      const d = down; down = null;
      if (!d.moved && this.onSticker) {
        const t = d.target.closest && d.target.closest('.st');
        if (t) this.onSticker(+t.dataset.slot, t);
      }
    };
    this.host.addEventListener('pointerup', up);
    this.host.addEventListener('pointercancel', () => { down = null; });
    this.host.addEventListener('dblclick', () => this.resetView());
  }
  turn(m, dur = this.dur) {
    return new Promise(res => {
      const base = m.replace(/['2]/g, '');
      const def = Cube.MD[base];
      if (!def) { res(); return; }
      const [axis, sign, layer] = def;
      const q = m.endsWith('2') ? 2 : (m.endsWith("'") ? -1 : 1);
      const ours = sign * 90 * q;
      const css = axis === 1 ? ours : -ours;
      const fn = ['rotateX', 'rotateY', 'rotateZ'][axis];
      const parts = this.cubies.filter(c => layer(c.p));
      const total = (Math.abs(q) === 2 ? 1.45 : 1) * dur;
      const gen = this.gen;
      const finish = () => {
        parts.forEach(c => c.el.style.transform = c.base);
        if (gen === this.gen) { this.state = Cube.apply(this.state, [m]); this.paint(); }
        res();
      };
      if (reduceMotion() || total < 30) { finish(); return; }
      const t0 = performance.now();
      const step = now => {
        if (gen !== this.gen) { res(); return; }
        const t = Math.min(1, (now - t0) / total);
        const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const a = css * e;
        for (const c of parts) c.el.style.transform = `${fn}(${a}deg) ${c.base}`;
        if (t < 1) this.raf = requestAnimationFrame(step); else finish();
      };
      this.raf = requestAnimationFrame(step);
    });
  }
  destroy() { this.gen++; cancelAnimationFrame(this.raf); if (this.ro) this.ro.disconnect(); }
}

/* ---------- annotate move lists into readable groups ---------- */
const KNOWN = [
  { name: '往右放公式', alg: "U R U' R' U' F' U F" },
  { name: '往左放公式', alg: "U' L' U L U F U' F'" },
  { name: '棱块公式', alg: "R U' R U R U R U' R' U' R2" },
  { name: '车灯公式', alg: "R' F R' B2 R F' R' B2 R2" },
  { name: '小鱼公式', alg: "R U R' U R U2 R'" },
  { name: '黄十字公式', alg: "F R U R' U' F'" },
  { name: '上左下右', alg: "R U R' U'", rep: true },
].map(k => ({ ...k, m: Cube.parse(k.alg) }));
function annotate(moves, stage) {
  const segs = [];
  let i = 0;
  const pushMisc = (m) => {
    let name = /^[U]/.test(m) ? '转顶层' : /^[y]/.test(m) ? '整个方块转' : '转动';
    if (stage === 'daisy') name = '送花瓣上去';
    if (stage === 'cross' && /2$/.test(m) && m[0] !== 'U') name = '转两下';
    const last = segs[segs.length - 1];
    if (last && last.misc && last.name === name && stage === 'daisy') { last.moves.push(m); return; }
    segs.push({ name, moves: [m], misc: true });
  };
  while (i < moves.length) {
    let hit = null;
    for (const k of KNOWN) {
      if (k.m.every((x, j) => moves[i + j] === x)) { hit = k; break; }
    }
    if (hit) {
      let reps = 1;
      if (hit.rep) while (hit.m.every((x, j) => moves[i + reps * 4 + j] === x)) reps++;
      const ms = moves.slice(i, i + hit.m.length * reps);
      segs.push({ name: hit.name + (reps > 1 ? ' ×' + reps : ''), moves: ms, alg: hit.alg, reps });
      i += ms.length;
    } else { pushMisc(moves[i]); i++; }
  }
  return segs;
}

      html += `<div class="pl-seg"><div class="pl-segname">${esc(s.name)}</div><div class="pl-segchips">`;
      s.moves.forEach((m, j) => { const i = s.from + j; html += `<button type="button" class="mv" data-i="${i}" aria-label="第${i + 1}步 ${m}"><b>${esc(m)}</b><small>${esc(shortOf(m))}</small></button>`; });

  segAt(i) { return this.segs.find(s => i >= s.from && i < s.to); }

    const now = chips[this.idx];
    if (now) {
      const box = this.host.querySelector('.pl-chips');
      const top = now.offsetTop - box.offsetTop;
      if (top < box.scrollTop || top > box.scrollTop + box.clientHeight - 50) box.scrollTop = top - 40;
    }

    if (!this.moves.length) { nx.innerHTML = ''; nx.hidden = true; }
    else if (this.idx >= this.moves.length) {
      nx.hidden = false;
      nx.innerHTML = `<div class="nx-done">${ICON.check}<div><b>${esc(this.finishText)}</b><span>一共 ${this.moves.length} 步。按 ${ICON.restart} 可以再看一次。</span></div></div>`;
    } else {

    const pb = this.host.querySelector('.pl-play');

  async fwd() {

  async back() {

  seek(i) {

  async play() {

      if (this.busy) { await sleep(40); continue; }
      const before = this.segAt(this.idx);
      await this.fwd();
      if (g !== this.gen || tok !== this.playTok) break;
      const after = this.segAt(this.idx);

  'p-back': { mask: 'all', inv: A.aperm, solver: 6, title: '车灯在后面', view: 'top' },
  'p-side': { mask: 'all', setup: Cube.invert(A.aperm).join(' ') + ' U', solver: 6, title: '车灯在右边', view: 'top' },
  'p-none': { mask: 'all', inv: A.yperm, solver: 6, title: '没有车灯', view: 'top' },
  // step 7
  'e-back': { mask: 'all', inv: A.ua, solver: 7, title: '完成的面在后面', view: 'top' },
  'e-other': { mask: 'all', inv: A.ub, solver: 7, title: '做一次还不对', view: 'top' },
  'e-none': { mask: 'all', inv: A.hperm, solver: 7, title: '一面都没完成', view: 'top' },
};
function caseState(id) {
  const c = CASES[id];
  let s = Cube.mask(MASK_FN[c.mask] || Cube.MASKS.all);
  if (c.pre) s = Cube.apply(s, c.pre);
  if (c.inv) s = Cube.apply(s, Cube.invert(c.inv));
  if (c.setup) s = Cube.apply(s, c.setup);
  return s;
}
function caseMoves(id, s) {
  const c = CASES[id];
  if (c.sol) return Cube.parse(c.sol);
  if (c.solver != null) return Cube.STAGES[c.solver].fn(s).moves;
  if (c.inv) return Cube.parse(c.inv);
  return [];
}
function caseFig(id, extra = {}) {
  const c = CASES[id];
  const s = caseState(id);
  const view = extra.view || c.view || 'up';
  if (view === 'top') return topSVG(s, { label: c.title, ...extra });
  return isoSVG(s, { view, label: c.title, ...extra });
}
function caseSpec(id) {
  const c = CASES[id];
  const s = caseState(id);
  const moves = caseMoves(id, s);
  const stage = c.solver != null ? STAGE_KEYS[c.solver] : null;
  let segs = moves.length ? annotate(moves, stage) : [];
  if (c.solver == null && segs.length && segs.every(x => x.misc)) segs = [{ name: c.title, moves }];
  return { state: s, moves, segs, title: c.title, sub: c.sub || (moves.length ? '按播放看演示，或一步一步看' : '拖动方块，转着看看') };
}

    const rc = Cube.center(s, 'R');

      fig: isoSVG(s, { label: '前面有一个倒 T' }), q: '前面已经连成倒 T。这个棱块要往哪边放？',

  shape() {
    const want = pick(['dot', 'L', 'line', 'cross']);
    let s;
    for (let t = 0; t < 80; t++) {
      s = Cube.mask(Cube.MASKS.ollEdges);
      for (let i = 0; i < 5; i++) s = Cube.apply(s, pick([A.fruruf, A.furuRf, 'U', "U'", A.sune, A.dot]));
      if (Cube.crossShape(s) === want) break;
    }

    const names = { dot: '点', L: '小拐弯 L', line: '一字', cross: '十字' };

  fish() {

      s = Cube.mask(Cube.MASKS.oll);

  },
  lights() {

/* ===== Pages, games, timer, router ===== */
const App = { cleanup: [], players: [] };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const main = () => document.getElementById('main');
const onCleanup = f => App.cleanup.push(f);
const isNarrow = () => window.matchMedia('(max-width: 900px)').matches;
const fmt = ms => { if (ms == null) return '—'; const s = ms / 1000; if (s < 60) return s.toFixed(2); const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(2).padStart(5, '0'); };
const LESSON_BY_KEY = Object.fromEntries(LESSONS.map((l, i) => [l.key, { ...l, i }]));
const done = () => Store.get('done', {});
const pieceName = cols => {
  const order = ['W', 'Y', 'R', 'O', 'B', 'G'];
  const c = cols.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
  return c.map(x => CN[x]).join('-') + (c.length === 3 ? ' 角块' : ' 棱块');
};
function makePlayer(host, o) { const p = new Player(host, o); App.players.push(p); onCleanup(() => p.destroy()); return p; }

/* ---------- shared hydration for lesson-like pages ---------- */
function hydrate(root, player, dock) {
  $$('figure.dg[data-case]', root).forEach(f => { const pic = $('.dg-pic', f); if (pic && !pic.innerHTML) pic.innerHTML = caseFig(f.dataset.case); });
  const toPlayer = (spec, src, autoplay) => {
    player.load(spec);
    if (isNarrow() && src) {
      const anchor = src.closest('.case, .algcard, .practice, .movegrid, .xcase, .cross-ch') || src;
      if (anchor.nextElementSibling !== dock) anchor.after(dock);
      dock.classList.add('inline');
      setTimeout(() => dock.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }), 30);
    }
    if (autoplay) setTimeout(() => player.play(), isNarrow() ? 650 : 350);
  };
  root.addEventListener('click', e => {
    const d = e.target.closest('.demo[data-case]');
    if (d) { toPlayer(caseSpec(d.dataset.case), d, true); return; }
    const mc = e.target.closest('.movecard');
    if (mc) {
      const m = mc.dataset.move;
      toPlayer({ state: Cube.solved(), moves: [m], segs: [{ name: m + ' · ' + shortOf(m), moves: [m] }], title: m + ' · ' + shortOf(m), sub: longOf(m), finishText: '转完了' }, mc, true);
      return;
    }
    const pr = e.target.closest('[data-practice]');
    if (pr) { toPlayer(practiceSpec(+pr.dataset.practice), pr, false); return; }
  });
  $$('.spotquiz', root).forEach(el => SpotQuiz(el, el.dataset.gen, +el.dataset.n || 5));
  $$('.guessgame', root).forEach(el => GuessGame(el));
}

/* ---------- spot quiz ---------- */
function SpotQuiz(host, gen, n) {
  let i = 0, score = 0;
  const ask = () => {
    const Q = QUIZ[gen]();
    let answered = false;
    host.innerHTML = `<div class="sq"><div class="sq-top"><span>第 ${i + 1} / ${n} 题</span><span class="sq-score">${ICON.star}${score}</span></div>
      <div class="sq-body"><div class="sq-fig">${Q.fig}</div><div class="sq-right"><p class="sq-q">${Q.q}</p>
      <div class="opts">${Q.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
      <div class="fb" aria-live="polite"></div></div></div></div>`;
    $$('.opt', host).forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const j = +b.dataset.j, ok = j === Q.ans;
      if (ok) score++;
      $$('.opt', host).forEach(x => { x.disabled = true; if (+x.dataset.j === Q.ans) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      $('.fb', host).innerHTML = `<div class="fb-box ${ok ? 'ok' : 'no'}">${ok ? ICON.check : ICON.retry}<div><b>${ok ? '答对了' : '再想想'}</b><p>${Q.why}</p></div></div>
        <button type="button" class="btn small next">${i + 1 < n ? '下一题' : '看成绩'}</button>`;
      $('.next', host).onclick = () => { i++; i < n ? ask() : finish(); };
      $('.sq-score', host).innerHTML = ICON.star + score;
    });
  };
  const finish = () => {
    host.innerHTML = `<div class="sq sq-end"><div class="sq-big">${score} / ${n}</div><p>${score === n ? '全部答对！你的眼睛很厉害。' : score >= n * .6 ? '很不错！错的那几题，再看一次说明就会了。' : '多练几次，这些图形会越看越熟。'}</p>
      <button type="button" class="btn small again">${ICON.restart}<span>再来一组</span></button></div>`;
    $('.again', host).onclick = () => { i = 0; score = 0; ask(); };
  };
  ask();
}

/* ---------- guess the move (lesson 1) ---------- */
function GuessGame(host) {
  const POOL = ['R', "R'", 'L', "L'", 'U', "U'", 'D', "D'", 'F', "F'"];
  let round = 0, score = 0, cur = null, answered = false;
  host.innerHTML = `<div class="gg"><div class="gg-cube"></div><div class="gg-side">
     <div class="sq-top"><span class="gg-round"></span><span class="sq-score">${ICON.star}0</span></div>
     <p class="sq-q">方块刚刚转了哪一下？</p><div class="opts gg-opts"></div><div class="fb" aria-live="polite"></div>
     <button type="button" class="btn ghost small gg-again">${ICON.restart}<span>再看一次</span></button></div></div>`;
  const view = new CubeView($('.gg-cube', host), { dur: 650 });
  onCleanup(() => view.destroy());
  const show = async () => { view.setState(Cube.solved()); await sleep(450); await view.turn(cur, 650); };
  const next = () => {
    if (round >= 8) {
      $('.gg-side', host).innerHTML = `<div class="sq-end"><div class="sq-big">${score} / 8</div><p>${score >= 7 ? '字母已经难不倒你了！' : '多看几次箭头卡片，再来挑战。'}</p><button type="button" class="btn small gg-restart">${ICON.restart}<span>再玩一次</span></button></div>`;
      const best = Store.get('guess-best', 0); if (score > best) Store.set('guess-best', score);
      $('.gg-restart', host).onclick = () => { GuessGame(host); };
      return;
    }
    round++; answered = false;
    cur = pick(POOL);
    const inv = Cube.invMove(cur);
    const others = shuffle(POOL.filter(x => x !== cur && x !== inv)).slice(0, 2);
    const opts = shuffle([cur, inv, ...others]);
    $('.gg-round', host).textContent = `第 ${round} / 8 题`;
    $('.gg-opts', host).innerHTML = opts.map(m => `<button type="button" class="opt mvopt" data-m="${m}"><b>${m}</b><small>${shortOf(m)}</small></button>`).join('');
    $('.fb', host).innerHTML = '';
    $$('.mvopt', host).forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const ok = b.dataset.m === cur; if (ok) score++;
      $$('.mvopt', host).forEach(x => { x.disabled = true; if (x.dataset.m === cur) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      $('.sq-score', host).innerHTML = ICON.star + score;

      };
    }

/* game: find the piece */
function pageGameFind() {
  const g = G('game-find');
  main().innerHTML = gameShell(g, '方块已经打乱。看上面要找的小块，拖动方块转着找，找到了就点它的任何一格。一共 8 块。', `
    <div class="find card"><div class="find-cube" id="fc"></div><div class="find-side" id="fs"></div></div>`);
  const fs = $('#fs');
  let view, targets, i, t0, misses, timer, busy = false;
  const start = () => {
    const st = Cube.apply(Cube.solved(), Cube.randomScramble(25));
    if (!view) { view = new CubeView($('#fc'), { state: st, onSticker: tap }); onCleanup(() => view.destroy()); } else { view.setState(st); view.setHighlight(null); }
    const pieces = shuffle(Cube.POS.filter(o => o.slots.length > 1));
    targets = [...pieces.filter(o => o.slots.length === 2).slice(0, 4), ...pieces.filter(o => o.slots.length === 3).slice(0, 4)].map(o => o.slots.map(k => Cube.solved()[k]));
    targets = shuffle(targets); i = 0; misses = 0; t0 = performance.now();
    clearInterval(timer); timer = setInterval(() => { const c = $('#fclk'); if (c) c.textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' 秒'; }, 100);
    show();
  };
  const show = (msg) => {
    const t = targets[i];
    fs.innerHTML = `<div class="sq-top"><span>第 ${i + 1} / 8 块</span><span class="clock" id="fclk"></span></div>
      <p class="muted">要找：</p><div class="target">${colorDots(t)}<b>${pieceName(t)}</b></div>
      <p class="muted small">${t.length === 3 ? '角块有 3 种颜色，在三个面碰在一起的角上。' : '棱块有 2 种颜色，在两个面中间。'}</p>
      <div class="fb" aria-live="polite">${msg || ''}</div>
      <button type="button" class="btn ghost small" id="hint">${ICON.bulb}<span>提示</span></button>`;
    $('#hint').onclick = () => {
      const o = Cube.findPiece(view.state, t);
      const where = []; const p = o.p;
      if (p[1] === 1) where.push('上面'); if (p[1] === -1) where.push('底面');
      if (p[0] === 1) where.push('右面'); if (p[0] === -1) where.push('左面');
      if (p[2] === 1) where.push('前面'); if (p[2] === -1) where.push('后面');
      $('.fb', fs).innerHTML = `<div class="fb-box no">${ICON.bulb}<div><b>提示</b><p>它在${where.join('和')}交界的地方。（以黄色中心为上、绿色中心为前）</p></div></div>`;
      misses++;
    };
  };
  function tap(slot) {
    if (busy || !targets || i >= 8) return;
    const t = targets[i];
    const o = Cube.findPiece(view.state, t);
    if (o.slots.includes(slot)) {
      busy = true;
      view.setHighlight(new Set(o.slots));
      $('.fb', fs).innerHTML = `<div class="fb-box ok">${ICON.check}<div><b>找到了！</b><p>${pieceName(t)}</p></div></div>`;
      setTimeout(() => { view.setHighlight(null); busy = false; i++; i < 8 ? show() : end(); }, 750);
    } else {
      misses++;
      const P = Cube.POS.find(x => x.slots.includes(slot));
      const cols = P.slots.map(k => view.state[k]);
      const what = P.slots.length === 1 ? `${CN[cols[0]]}色中心块` : pieceName(cols);
      $('.fb', fs).innerHTML = `<div class="fb-box no">${ICON.retry}<div><b>再找找</b><p>这一块是“${what}”。要找的是“${pieceName(t)}”。</p></div></div>`;
    }
  }
  const end = () => {
    clearInterval(timer);
    const sec = (performance.now() - t0) / 1000;
    const nb = setBest(g.key, sec.toFixed(1) + ' 秒', Object.assign(v => sec < v, { value: sec }));
    fs.innerHTML = `<div class="sq-end"><div class="sq-big">${sec.toFixed(1)} 秒</div><p>找齐 8 块，点错或用提示 ${misses} 次。${nb ? '新纪录！' : ''}</p>
      <p class="muted small">秘诀：先想好这一块的颜色在哪几个面中间（看中心！），再去那里找。</p><button type="button" class="btn" id="ag">${ICON.restart}<span>再玩一次</span></button></div>`;
    $('#ag').onclick = start;
  };
  onCleanup(() => clearInterval(timer));
  fs.innerHTML = `<div class="gstart"><p>准备好了就开始，计时会马上开始。</p><button type="button" class="btn" id="go">${ICON.play}<span>开始</span></button></div>`;
  view = new CubeView($('#fc'), { onSticker: tap }); onCleanup(() => view.destroy());
  $('#go').onclick = start;
}

/* game: predict */
function pageGamePredict() {
  const g = G('game-predict');
  main().innerHTML = gameShell(g, '图上有一颗星星 ★。照着转一下（或两下）之后，星星会跑到哪一格？选 A、B、C 或 D。', `<div class="card gbox" id="gp"></div>`);
  const box = $('#gp');
  const VIS = k => ['U', 'F', 'R'].includes(Cube.SLOTS[k].f);
  let lvl = 1, i, score;
  const FACE_CN = { U: '上面', F: '前面', R: '右面', D: '底面', L: '左面', B: '后面' };
  const make = () => {
    const pool = ['R', "R'", 'U', "U'", 'F', "F'", 'L', "L'", 'D', "D'"];
    for (let t = 0; t < 200; t++) {
      const ms = lvl === 1 ? [pick(pool)] : [pick(pool), pick(pool)];
      if (ms.length === 2 && ms[0][0] === ms[1][0]) continue;
      const ids = Array.from({ length: 54 }, (_, k) => k);
      const after = Cube.apply(ids, ms);
      const k = pick(Array.from({ length: 54 }, (_, q) => q).filter(q => VIS(q) && q % 9 !== 4));
      const dest = after.indexOf(k);
      if (dest === k || !VIS(dest)) continue;
      const near = Array.from({ length: 54 }, (_, q) => q).filter(q => VIS(q) && q !== k && q !== dest && q % 9 !== 4);
      const sameFace = near.filter(q => Cube.SLOTS[q].f === Cube.SLOTS[dest].f);
      const ds = shuffle(sameFace).slice(0, 2);
      const rest = shuffle(near.filter(q => !ds.includes(q))).slice(0, 3 - ds.length);
      const choices = shuffle([dest, ...ds, ...rest]);
      return { ms, k, dest, choices };
    }
  };
  const start = () => { i = 0; score = 0; ask(); };
  const ask = () => {
    const P = make();
    const s = Cube.solved();
    const marks = { [P.k]: '★' }; P.choices.forEach((c, j) => marks[c] = 'ABCD'[j]);
    let answered = false;
    box.innerHTML = `<div class="sq"><div class="sq-top"><span>${lvl === 1 ? '1 级：转一下' : '2 级：连转两下'} · 第 ${i + 1} / 10 题</span><span class="sq-score">${ICON.star}${score}</span></div>
      <div class="sq-body"><div class="sq-fig">${isoSVG(s, { marks, move: P.ms.length === 1 ? P.ms[0] : null, label: '有星星和 ABCD 的方块' })}</div>
      <div class="sq-right"><p class="sq-q">照着转：</p>${algChips(P.ms.join(' '))}<p class="sq-q">★ 会跑到哪一格？</p>
      <div class="opts four">${'ABCD'.split('').map((l, j) => `<button type="button" class="opt" data-j="${j}">${l}</button>`).join('')}</div><div class="fb" aria-live="polite"></div></div></div></div>`;
    $$('.opt', box).forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const j = +b.dataset.j, ok = P.choices[j] === P.dest; if (ok) score++;
      const aj = P.choices.indexOf(P.dest);
      $$('.opt', box).forEach(x => { x.disabled = true; if (+x.dataset.j === aj) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      const fromF = Cube.SLOTS[P.k].f, toF = Cube.SLOTS[P.dest].f;
      $('.fb', box).innerHTML = `<div class="fb-box ${ok ? 'ok' : 'no'}">${ok ? ICON.check : ICON.retry}<div><b>${ok ? '答对了' : '再想想'}：答案是 ${'ABCD'[aj]}</b><p>★ 跟着转动的那一层走，从${FACE_CN[fromF]}${fromF === toF ? '换了一个位置，还在' + FACE_CN[toF] : '跑到了' + FACE_CN[toF]}。</p></div></div>
        <div class="after"><span class="muted small">转完以后：</span>${isoSVG(Cube.apply(s, P.ms), { marks: { [P.dest]: '★' }, label: '转完以后' })}</div>
        <button type="button" class="btn small" id="nx">${i < 9 ? '下一题' : '看成绩'}</button>`;
      $('#nx').onclick = () => { i++; i < 10 ? ask() : end(); };
      $('.sq-score', box).innerHTML = ICON.star + score;
    });
  };
  const end = () => {
    const nb = setBest(g.key, `${lvl} 级 ${score}/10`, Object.assign(v => lvl * 100 + score > v, { value: lvl * 100 + score }));
    box.innerHTML = `<div class="sq-end"><div class="sq-big">${score} / 10</div><p>${nb ? '新纪录！' : ''}${score >= 8 && lvl === 1 ? '可以挑战 2 级了！' : '在脑子里转方块，就是高手“预判”的本领。'}</p>
      <div class="btnrow"><button type="button" class="btn" id="l1">1 级：转一下</button><button type="button" class="btn ghost" id="l2">2 级：连转两下</button></div></div>`;
    $('#l1').onclick = () => { lvl = 1; start(); }; $('#l2').onclick = () => { lvl = 2; start(); };
  };
  box.innerHTML = `<div class="gstart"><p>选择等级：</p><div class="btnrow"><button type="button" class="btn" id="l1">1 级：转一下</button><button type="button" class="btn ghost" id="l2">2 级：连转两下</button></div></div>`;
  $('#l1').onclick = () => { lvl = 1; start(); }; $('#l2').onclick = () => { lvl = 2; start(); };
}

        <p class="muted small">可以用：R L U D F B M E S x y z，加 ' 或 2。小写字母（r、f）是两层一起转。</p>
      </div>
    </div>
    <aside class="lesson-side"><div class="dock"><div id="player"></div></div></aside>
  </div>`;
  const player = makePlayer($('#player'), {});
  player.load({ state: Cube.solved(), moves: [], title: '我的魔术方块', sub: '拖动方块可以转着看' });
  const log = [];
  const writeLog = () => { $('#pLog').textContent = '已转：' + (log.length ? Cube.simplify(log).slice(-40).join(' ') : '（还没有）'); };
  let busy = false;
  const doMove = async m => {
    if (busy) return; busy = true;
    if (player.moves.length) { const st = player.view.state; player.load({ state: st, moves: [], title: '我的魔术方块', sub: '' }); }
    await player.view.turn(m, 200); log.push(m); writeLog(); busy = false;
    player.start = player.view.state.slice();
    if (Cube.isSolved(player.view.state) && log.length > 3) toast('还原好了！');
  };
  $('.pad').addEventListener('click', e => { const b = e.target.closest('.padbtn'); if (b) doMove(b.dataset.m); });
  $('#pScr').onclick = async () => {
    if (busy) return; busy = true;
    player.load({ state: player.view.state, moves: [], title: '打乱中…', sub: '' });
    const sc = Cube.randomScramble(20);
    for (const m of sc) { await player.view.turn(m, 70); log.push(m); }
    writeLog(); busy = false;
    player.load({ state: player.view.state, moves: [], title: '已经打乱', sub: '打乱公式：' + sc.join(' ') });
  };
  $('#pSolve').onclick = () => {
    if (busy) return;
    const st = player.view.state;
    if (Cube.isSolved(st)) { toast('方块已经是还原好的，先打乱吧！'); return; }
    const r = Cube.solveBeginner(st);
    const segs = [];
    r.parts.forEach((p, i) => annotate(p.moves, STAGE_KEYS[i]).forEach(s => segs.push({ ...s, stage: STAGE_TITLE[i] })));
    const moves = segs.flatMap(s => s.moves);
    player.load({ state: st, moves, segs, title: '用 7 个步骤还原', sub: `一共 ${moves.length} 步。可以按播放，也可以一步一步看。`, finishText: '还原好了！' });
    log.length = 0; writeLog();
    if (isNarrow()) $('.lesson-side').scrollIntoView({ behavior: 'smooth' });
  };
  $('#pUndo').onclick = () => { if (!log.length || busy) return; const m = log.pop(); busy = true; player.view.turn(Cube.invMove(m), 200).then(() => { busy = false; player.start = player.view.state.slice(); writeLog(); }); };
  $('#pReset').onclick = () => { log.length = 0; writeLog(); player.load({ state: Cube.solved(), moves: [], title: '我的魔术方块', sub: '' }); };
  $('#algGo').onclick = () => {
    const ms = Cube.parse($('#algIn').value);
    if (!ms.length) { toast('没有看懂这个公式，检查一下字母。'); return; }
    player.load({ state: player.view.state, moves: ms, segs: annotate(ms), title: '我的公式', sub: ms.join(' ') });
    player.play();
  };
  const key = e => {
    if (e.target.closest('input, textarea')) return;
    const k = e.key.toUpperCase();
    if ('RLUDFB'.includes(k) && k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); doMove(k + (e.shiftKey ? "'" : '')); }
  };
  document.addEventListener('keydown', key); onCleanup(() => document.removeEventListener('keydown', key));
}

/* ---------- follow along ---------- */
const STAGE_TIPS = {
  daisy: '找白色棱块，送上顶层围着黄色中心，白色朝上。上面已经有花瓣，就先转顶层让开。',
  cross: '转顶层，让花瓣侧面的颜色对上中心，再把那一面转两下。',
  corners: '找顶层的白色角块，送到它家的正上方（右前上），重复“上左下右”。',
  second: '找顶层没有黄色的棱块，连成倒 T，看顶上的颜色往左或往右放。',
  ycross: '看黄色形状：点、L、一字。L 放左上，一字横着放，做黄十字公式。',
  yface: '数黄色角块。1 个放左前方；0 或 2 个让左前角的黄色朝左。做小鱼公式。',
  cperm: '找车灯，放到后面，做车灯公式。四面都有车灯就转顶层对齐。',
  eperm: '把完成的一面放到后面，做棱块公式。',
};
function solutionSpec(st, title) {
  const r = Cube.solveBeginner(st);
  const segs = [];
  r.parts.forEach((p, i) => annotate(p.moves, STAGE_KEYS[i]).forEach(s => segs.push({ ...s, stage: STAGE_TITLE[i], key: STAGE_KEYS[i] })));
  const moves = segs.flatMap(s => s.moves);
  return { ok: Cube.isSolved(r.state), spec: { state: st, moves, segs, title, sub: `一共 ${moves.length} 步，分成 7 个步骤。`, finishText: '还原好了！你做到了！' } };
}
function pageFollow() {
  main().innerHTML = `
  <header class="page-head"><p class="eyebrow">跟我还原</p><h1>拿着你的方块，一步一步跟着做</h1>
  <p class="lead">两种开始方法：照着打乱公式把还原好的方块打乱；或者把你手上已经乱掉的方块的颜色填进来。</p></header>

  <div id="fwork"></div>`;
  const work = $('#fwork');
  $$('.tab').forEach(t => t.onclick = () => { $$('.tab').forEach(x => x.classList.toggle('on', x === t)); t.dataset.t === 'scr' ? scrMode() : inpMode(); });

  const showSolution = (st, title) => {
    const { ok, spec } = solutionSpec(st, title);
    if (!ok) return false;
    work.innerHTML = `<div class="lesson follow"><div class="lesson-main"><div class="stagecard card" id="stc"></div>
      <div class="card"><h3>小提醒</h3><ul class="checks"><li>一直保持黄色朝上、绿色对着你（看到 y 时，整个方块跟着转）。</li><li>用“走一步”按钮，每按一次就跟着转一下。</li><li>转错了？按“退一步”，或者从头开始。</li></ul>
      <button type="button" class="btn ghost small" id="restartF">${ICON.restart}<span>换一个方块</span></button></div></div>
      <aside class="lesson-side"><div class="dock"><div id="player"></div></div></aside></div>`;
    player = makePlayer($('#player'), {});
    player.speed = 'slow'; player.renderSpeed();
    player.load(spec);
    const stc = $('#stc');
    let lastKey = null;
    player.onChange = idx => {
      const seg = player.segAt(Math.min(idx, player.moves.length - 1));
      const key = idx >= player.moves.length ? 'done' : seg && seg.key;
      if (key === lastKey) return; lastKey = key;
      if (key === 'done') { stc.innerHTML = `<p class="eyebrow">完成</p><h2>还原好了！</h2><p>去计时器记录一次时间吧。</p><a class="btn" href="#timer">去计时器</a>`; return; }
      const si = STAGE_KEYS.indexOf(key);

    };

      if ($('#solveF')) $('#solveF').onclick = () => {
        const err = validate(st);
        if (err) { $('#inMsg').innerHTML = `<div class="fb-box no">${ICON.retry}<div><b>再检查一下</b><p>${err}</p></div></div>`; return; }

function validate(st) {
  if (st.some(c => !c || c === 'X')) return '还有格子没有填颜色。每一面都要填满 9 格。';
  const n = {}; st.forEach(c => n[c] = (n[c] || 0) + 1);
  for (const c of 'WYRGBO') if (n[c] !== 9) return `${CN[c]}色有 ${n[c] || 0} 格，应该刚好 9 格。`;
  const OPP = { W: 'Y', Y: 'W', R: 'O', O: 'R', B: 'G', G: 'B' };
  const S = Cube.solved();
  const want = new Set(Cube.POS.filter(o => o.slots.length > 1).map(o => o.slots.map(k => S[k]).sort().join('')));
  const seen = new Set();
  for (const o of Cube.POS) {
    if (o.slots.length < 2) continue;
    const cs = o.slots.map(k => st[k]);
    for (const a of cs) if (cs.includes(OPP[a])) return `有一块同时有${CN[a]}色和${CN[OPP[a]]}色。它们是对面的颜色，不会在同一块上。`;
    const key = cs.slice().sort().join('');
    if (!want.has(key)) return `“${cs.map(c => CN[c]).join('-')}”这一块不存在，可能有一格填错了。`;
    if (seen.has(key)) return `“${cs.map(c => CN[c]).join('-')}”出现了两次，可能有一格填错了。`;
    seen.add(key);
  }
  return null;
}

  <div class="lesson">
    <header class="lesson-head"><p class="eyebrow">学会以后</p><h1>20 秒之路</h1><p class="goal">从“会还原”到“20 秒”，要换更快的方法，也要练眼睛和手指。照着路线一站一站来，不用急。</p></header>
    <div class="lesson-main prose">
      <h2>时间都花在哪里？</h2>
      <p>同样是还原，新手和 20 秒高手的时间分配差很多。下面是大约的数字：</p>
      <div class="barpair">${bars('新手：大约 2 分钟', [['白十字', 25], ['白色角块', 30], ['第二层', 30], ['顶层 4 步', 35]], 40)}${bars('20 秒高手：大约 20 秒', [['白十字', 3], ['F2L 前两层', 10], ['顶层：黄色面', 3], ['顶层：换位', 4]], 40)}</div>
      <p>新手最多的时间，其实花在<b>停下来找小块</b>。所以练观察，跟练手指一样重要。</p>
      <h2>路线图</h2>
      <ol class="road vertical">${ROAD.map(r => `<li><span class="road-t">${r.t}</span><b>${r.name}</b><small>${r.what}</small></li>`).join('')}</ol>
      <h2>第 1 站：熟练 + 指法</h2>
      <p>公式要熟到“手指自己会动”，不用想下一步。拿法：两手的大拇指在前面，其他手指在后面，方块放在指尖，不要握太紧。</p>
      <div class="finger">
        ${[['R', '右手手腕往上翻'], ["R'", '右手手腕往下翻'], ['U', '右手食指把顶层往左拨'], ["U'", '左手食指把顶层往右拨'], ['F', '右手大拇指往下推'], ['L', '左手手腕往下翻'], ["L'", '左手手腕往上翻'], ['D', '左手无名指把底层往右拨']].map(([m, t]) => `<div><span class="mv static"><b>${m}</b><small>${shortOf(m)}</small></span><p>${t}</p></div>`).join('')}
      </div>
      ${rule('四步舞挑战', '用计时器计时：连做 6 次“上左下右”（方块会变回原样）。目标 6 秒 → 4 秒 → 3 秒以内。转的时候不要换手。')}
      <h2>第 2 站：直接做底十字</h2>
      <p>不用小雏菊，直接把白色棱块放到底部。一开始会比较慢，练熟以后平均 8 步以内就能做完。比赛前有 15 秒观察时间，用来把白十字想好。</p>
      <div class="cross-ch card"><div class="cc-left" id="ccLeft"></div></div>
      <h2>第 3 站：F2L 入门</h2>
      <p>新手方法是先放角块、再放棱块。F2L 是把<b>一个角块和一个棱块先配成一对，再一起放进去</b>，第一层和第二层一起完成。下面 8 种最常见，都放到右前方的槽里（白色在底，黄色朝上）。</p>
      ${tip('怎么看图', '灰色的是顶层的其他小块，不用管。彩色的是要配对的角块和棱块。')}
      <div class="xcases">${Object.entries(XCASES).map(([id, v]) => `<div class="xcase"><figure class="dg" data-case="${id}"><div class="dg-pic"></div></figure><div><b>${v.t}</b>${algChips(v.alg)}<p class="muted small">${v.n}</p><button type="button" class="btn small demo" data-case="${id}">${ICON.play}<span>看演示</span></button></div></div>`).join('')}</div>
      <h2>第 4 站：两步顶层（4LLL）</h2>
      <p>把顶层分成 4 小步：先黄十字、再黄色面、再换角块、最后换棱块。一共 16 个公式。你已经会其中 4 个（黄十字、小鱼、车灯、棱块公式）！每星期学 2～3 个就好。</p>
      ${LL4.map(G => `<h3>${G.g}</h3><div class="xcases ll">${G.items.map(([id, alg, name]) => `<div class="xcase"><figure class="dg" data-case="${id}"><div class="dg-pic">${topSVG(caseState(id), { alg: G.arrows ? alg : null, labels: false, label: name })}</div></figure><div><b>${name}</b>${algChips(alg)}<button type="button" class="btn small demo" data-case="${id}">${ICON.play}<span>看演示</span></button></div></div>`).join('')}</div>`).join('')}
      ${tip('看懂箭头', '换位的图里，箭头表示做完公式后，小块会搬到哪里。双箭头是两块互相交换。')}
      <h2>第 5 站：预判，冲 20 秒</h2>
      <ul class="checks">
        <li><b>慢就是快：</b>用比平常慢一点、但<b>不停下来</b>的速度转。停顿比慢转更浪费时间。</li>
        <li><b>边转边找：</b>做公式的时候，眼睛已经在找下一对小块。</li>
        <li><b>每天玩观察训练营：</b>图形侦探练认图，预测高手练脑中转方块。</li>
        <li><b>用好方块：</b>一个顺滑的磁力速拧方块，比旧方块快很多。</li>
      </ul>
      <h2>每天 15～20 分钟练习表</h2>
      <div class="plan">
        ${[['3 分钟', '暖手', '四步舞 R U R\' U\' 做 6 次 × 3 轮'], ['3 分钟', '观察训练营', '玩 1 个游戏'], ['5 分钟', '专项', '这个星期在学的公式或步骤，慢慢做 10 次'], ['5～8 分钟', '计时还原', '计时还原 5 次，看“最近 5 次平均”']].map(([t, a, b]) => `<div><span class="road-t">${t}</span><b>${a}</b><p>${b}</p></div>`).join('')}
      </div>
      <p class="muted">进步不是每天都看得到。每星期比一次“最近 12 次平均”，就会发现自己变快了。</p>
    </div>
    <aside class="lesson-side"><div class="dock" id="dock"><div id="player"></div></div></aside>
  </div>`;
  const dock = $('#dock');
  const player = makePlayer($('#player'), {});
  player.load(caseSpec('x-1'));
  hydrate($('.lesson-main'), player, dock);
  bindPlayerKeys(player);
  // cross challenge
  const cc = $('#ccLeft');
  let ccTimer;
  onCleanup(() => clearInterval(ccTimer));
  const newCross = () => {
    clearInterval(ccTimer);
    const sc = Cube.randomScramble(20);
    const st = Cube.apply(Cube.solved(), sc);
    cc.innerHTML = `<div class="scr-head"><b>白十字挑战</b><span class="clock" id="ccClk">15</span></div>
      <p class="muted small">照打乱公式打乱（黄色朝上、绿色朝前）。用 15 秒观察：4 个白色棱块在哪？先放哪一个？然后自己试，最后看最少步数的答案。</p>
      ${algChips(sc.join(' '))}
      <div class="cc-net">${netSVG(st, { label: '打乱后的展开图' })}</div>
      <div class="btnrow"><button type="button" class="btn small" id="ccAns">${ICON.play}<span>看最少步数答案</span></button><button type="button" class="btn ghost small" id="ccNew">${ICON.shuffle}<span>换一题</span></button></div>`;
    const t0 = performance.now();
    ccTimer = setInterval(() => { const c = $('#ccClk'); if (!c) return; const left = 15 - (performance.now() - t0) / 1000; c.textContent = left > 0 ? Math.ceil(left) + ' 秒观察' : '开始做！'; if (left <= 0) clearInterval(ccTimer); }, 200);
    $('#ccNew').onclick = newCross;
    $('#ccAns').onclick = () => {
      const b = $('#ccAns'); b.disabled = true; b.querySelector('span').textContent = '计算中…';
      setTimeout(() => {
        const sol = Cube.solveCross(st);
        player.load({ state: maskCross(st), moves: sol, segs: [{ name: '最少步数白十字', moves: sol }], title: `白十字：${sol.length} 步`, sub: '灰色的小块现在不用管，只看白色棱块。', finishText: `白十字完成，只用了 ${sol.length} 步！` });
        b.disabled = false; b.querySelector('span').textContent = '看最少步数答案';
        if (isNarrow()) { cc.parentElement.after(dock); dock.classList.add('inline'); dock.scrollIntoView({ behavior: 'smooth' }); }
        player.play();
      }, 30);
    };
  };
  newCross();
}
function maskCross(st) {
  // keep only white edges + centers visible (by current colors)
  return st.map((c, k) => {
    const P = Cube.POS.find(o => o.slots.includes(k));
    if (P.slots.length === 1) return c;
    const cols = P.slots.map(q => st[q]);
    return P.slots.length === 2 && cols.includes('W') ? c : 'X';
  });
}

/* ---------- cheat cards ---------- */
function pageCards() {
  const C = [
    ['第 1 步', '白十字', 'c-goal', '4 个白色棱块在哪里？', DAISY.split(' ').slice(0, 1).join(' '), '小雏菊 → 对齐颜色 → 转两下', null],
    ['第 2 步', '白色角块', 'k-goal', '白色朝右 1 次、朝上 3 次、朝前 5 次', A.sexy, '上 · 左 · 下 · 右', 'learn-3'],
    ['第 3 步', '第二层', 's-goal', '顶层没有黄色的棱块；连成倒 T', A.right, '往右：推走 抬起 回来 放下 ×2', 'learn-4'],
    ['第 4 步', '黄十字', 'y-goal', '点 → L（放左上）→ 一字（横放）→ 十字', A.fruruf, '前顺 ｜ 上 左 下 右 ｜ 前逆', 'learn-5'],
    ['第 5 步', '黄色面', 'f-goal', '1 个放左前；0 或 2 个让左前角黄色朝左', A.sune, '上左 · 下左 · 上左左 · 下', 'learn-6'],
    ['第 6 步', '顶层角块', 'p-back', '找车灯，放后面', A.aperm, "R' F R' ｜ B2 ｜ R F' R' ｜ B2 R2", 'learn-7'],
    ['第 7 步', '顶层棱块', 'e-back', '完成的一面放后面', A.ua, '上右 · 上左 · 上左 · 上右 · 下右 · 上上', 'learn-8'],
  ];
  main().innerHTML = `
  <header class="page-head"><p class="eyebrow">口诀卡</p><h1>7 步口诀，一页记住</h1><p class="lead">每一步：先<b>看</b>什么，再<b>做</b>什么。忘了的时候来这里看一眼，点卡片可以回到那一关。</p></header>
  <div class="cards">${C.map(([k, t, id, look, alg, chant, link]) => `
    <a class="ccard" href="#${link || 'learn-2'}"><div class="ccard-top"><span class="eyebrow">${k}</span><b>${t}</b></div>
      <div class="ccard-pic">${caseFig(id)}</div>
      <div class="ccard-row"><span class="ccard-lab">${ICON.eye}看</span><span>${look}</span></div>
      <div class="ccard-row"><span class="ccard-lab">${ICON.hand}做</span>${k === '第 1 步' ? '<span>花瓣对齐颜色后，那一面转两下（例如 F2）</span>' : algChips(alg)}</div>
      <div class="chant"><span>念法</span><b>${chant}</b></div></a>`).join('')}</div>
  <section class="prose narrow"><h2>口诀小字典</h2>
  <div class="mnemo">${[['R', "R'"], ['U', "U'"], ['F', "F'"], ['L', "L'"], ['D', "D'"], ['y', "y'"]].map(([a, b]) => `<div><span class="mv static"><b>${a}</b><small>${shortOf(a)}</small></span><span class="mv static"><b>${b}</b><small>${shortOf(b)}</small></span></div>`).join('')}</div>
  <p class="muted">念法里只用右手和顶层的时候：R 念“上”，R' 念“下”，U 念“左”，U' 念“右”，R2 念“上上”，U2 念“左左”。</p></section>`;
}

/* ---------- router ---------- */
const PAGES = { home: pageHome, camp: pageCamp, play: pagePlay, follow: pageFollow, timer: pageTimer, speed: pageSpeed, cards: pageCards, 'game-colors': pageGameColors, 'game-flash': pageGameFlash, 'game-find': pageGameFind, 'game-shape': pageGameShape, 'game-predict': pageGamePredict };
function route() {
  App.cleanup.forEach(f => { try { f(); } catch (e) { } });
  App.cleanup = []; App.players = [];
  const key = (location.hash || '#home').slice(1);
  try {
    if (LESSON_BY_KEY[key]) pageLesson(LESSON_BY_KEY[key]);
    else (PAGES[key] || pageHome)();
  } catch (err) {
    main().innerHTML = `<div class="card"><h2>这一页出了点问题</h2><p>${esc(err.message)}</p><a class="btn" href="#home">回到首页</a></div>`;
    console.error(err);
  }
  const navKey = LESSON_BY_KEY[key] ? 'home' : key.startsWith('game-') ? 'camp' : (PAGES[key] ? key : 'home');
  $$('.nav a').forEach(a => { const on = a.getAttribute('href') === '#' + navKey; a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
  const navOn = $('.nav a.on'); if (navOn && navOn.scrollIntoView) { const nav = $('.nav'); nav.scrollLeft = navOn.offsetLeft - 20; }
  window.scrollTo(0, 0);
}
function boot() {
  $('.nav').innerHTML = NAV.map(([k, n]) => `<a href="#${k}">${n}</a>`).join('');
  window.addEventListener('hashchange', route);
  route();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
